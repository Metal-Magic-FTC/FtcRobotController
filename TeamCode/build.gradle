//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.
apply plugin: 'com.android.application'

buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"

        }
        maven { url "https://repo.dairy.foundation/releases" }

    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

//
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }

    // Old code written for Pedro Pathing 2 / Road Runner. It does not compile against Pedro 3, so it is kept in the
    // repo but left out of the build. Delete a line here (and port the code) to bring it back.
    sourceSets {
        main {
            java {
                exclude 'org/firstinspires/ftc/teamcode/decode/**'           // last season, Pedro 2
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/MecanumDrive.java'      // Road Runner
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/pinpoint/Localizer.java'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/pinpoint/*DeadWheelLocalizer.java'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/pinpoint/TankDrive.java'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/tuning/**'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/other/Drawing.java'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/util/ControlTheory/CustomPIDController.java' // FTC Dashboard
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/util/Camera/*.java'                // SDK 11 AprilTag API
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/pinpoint/LocalizeWithOdo.java'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/pinpoint/PinpointAutoRight.java'
                exclude 'org/firstinspires/ftc/teamcode/mmintothedeep/odometry/pinpoint/tagLocalizer.java'
                exclude 'org/firstinspires/ftc/teamcode/messages/**'         // Road Runner log messages
                exclude 'org/firstinspires/ftc/teamcode/summer26/aarushTests/tests/GuthaAuto*.java' // Pedro 2
                exclude 'org/firstinspires/ftc/teamcode/biobuzz/comp1/pedroPathing/**' // Pedro 2 constants/tuning, replaced by biobuzz/comp1/pedro
            }
        }
    }
}

repositories {
    maven {
        url = 'https://repo.dairy.foundation/releases'
    }
}

dependencies {

    implementation project(':FtcRobotController')
    implementation 'androidx.xr.runtime:runtime:1.0.0-alpha07'
    // NOTE: must stay below 2.12.0 — tensorflow-lite 2.12+ references the
    // strtod_l libc symbol, which doesn't exist on Android 7.1.1 (API 25),
    // the OS on REV Control Hub v1.0. Using 2.12+ throws UnsatisfiedLinkError
    // at Interpreter construction and crashes the OpMode on INIT.
    implementation 'org.tensorflow:tensorflow-lite:2.9.0'

    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")

    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.2'
}
